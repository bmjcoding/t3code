<!doctype html>
<!-- Interactive preview of the inline splash in apps/web/index.html. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevSpace Pro Galaxy Splash</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html.dark body {
        background: #0a0a0a;
        color: #f5f5f5;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      /* DevSpace Pro galaxy splash. Pure CSS, so it animates before any JS runs;
         React's first commit (or showBootError) removes the whole tree. It must stay
         compositor-only so it never competes with the bundle for the main thread:
         animate transform/opacity on HTML boxes (an <svg> may animate opacity only),
         never filter, and never two animations of one property on one element.
         Every loop is finite: it all settles by ~12s, so a slow boot never keeps the
         GPU busy. Star coordinates are generated data. */
      #boot-shell {
        --gx-bg: var(--boot-background, #ffffff);
        --gx-fg: var(--boot-foreground, #262626);
        --gx-accent: var(--boot-accent, #4f46e5);
        --gx-k: 0.5;
      }

      html.dark #boot-shell {
        --gx-bg: var(--boot-background, #0a0a0a);
        --gx-fg: var(--boot-foreground, #f5f5f5);
        --gx-accent: var(--boot-accent, #818cf8);
        --gx-k: 1;
      }

      .gx {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        contain: strict;
        pointer-events: none;
      }

      .gx svg {
        display: block;
        overflow: visible;
      }

      @keyframes gx-twinkle {
        50% {
          opacity: 0.12;
        }
      }

      /* Nebula, core glow and star field warp in as one layer. */
      .gx-back {
        position: absolute;
        inset: 0;
        animation: gx-back-in 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes gx-back-in {
        from {
          opacity: 0;
          transform: scale(0.22);
        }
      }

      .gx-back i {
        position: absolute;
        top: 50%;
        left: 50%;
        border-radius: 50%;
      }

      .gx-n1 {
        width: 780px;
        height: 430px;
        margin: -215px 0 0 -390px;
        translate: -150px -50px;
        rotate: -12deg;
        background: radial-gradient(
          closest-side,
          color-mix(in oklab, var(--gx-accent) calc(32% * var(--gx-k)), transparent),
          transparent
        );
      }

      .gx-n2 {
        width: 640px;
        height: 370px;
        margin: -185px 0 0 -320px;
        translate: 195px 65px;
        background: radial-gradient(
          closest-side,
          oklch(from var(--gx-accent) l c calc(h + 70) / calc(0.26 * var(--gx-k))),
          transparent
        );
      }

      .gx-n3 {
        width: 1200px;
        height: 280px;
        margin: -140px 0 0 -600px;
        rotate: -11deg;
        background: radial-gradient(
          closest-side,
          oklch(
            from var(--gx-accent) calc(l + 0.1) calc(c * 0.6) calc(h - 45) /
              calc(0.16 * var(--gx-k))
          ),
          transparent
        );
      }

      .gx-bulge {
        width: 320px;
        height: 320px;
        margin: -160px;
        background: radial-gradient(
          closest-side,
          color-mix(in oklab, var(--gx-accent) calc(28% * var(--gx-k)), transparent),
          transparent
        );
      }

      /* Stars are zero-length round-capped subpaths. */
      .gx-sky {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: var(--gx-fg);
        stroke-linecap: round;
        stroke-width: 2.5;
        opacity: calc(0.35 + 0.65 * var(--gx-k));
      }

      .gx-sky path {
        vector-effect: non-scaling-stroke;
      }

      .gx-s1 {
        stroke-width: 1.3;
        stroke-opacity: 0.6;
      }

      .gx-s2 {
        stroke-width: 1.9;
        stroke-opacity: 0.85;
      }

      .gx-t1 {
        animation: gx-twinkle 3.1s ease-in-out 3;
      }

      .gx-t2 {
        animation: gx-twinkle 4.3s ease-in-out 1.2s 2;
      }

      .gx-t3 {
        stroke: var(--gx-accent);
        animation: gx-twinkle 3.7s ease-in-out 2s 2;
      }

      /* Flare stars and shooting stars. */
      .gx-fx {
        position: absolute;
        top: 50%;
        left: 50%;
        opacity: calc(0.45 + 0.55 * var(--gx-k));
      }

      .gx-fx i {
        position: absolute;
        opacity: 0;
      }

      .gx-spark {
        width: 26px;
        height: 26px;
        margin: -13px;
        background:
          radial-gradient(
            circle,
            var(--gx-fg) 1.2px,
            color-mix(in oklab, var(--gx-accent) 60%, transparent) 2px,
            transparent 6px
          ),
          linear-gradient(90deg, transparent, var(--gx-fg), transparent) center / 100% 1px no-repeat,
          linear-gradient(transparent, var(--gx-fg), transparent) center / 1px 100% no-repeat;
        translate: -36vw -27vh;
        animation: gx-spark 4.6s ease-in-out 1.2s 2 both;
      }

      .gx-spark:nth-child(2) {
        translate: 33vw -22vh;
        animation-delay: 2.1s;
      }

      .gx-spark:nth-child(3) {
        translate: -24vw 31vh;
        animation-delay: 1.7s;
      }

      .gx-spark:nth-child(4) {
        translate: 39vw 26vh;
        animation-delay: 2.6s;
      }

      @keyframes gx-spark {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.2) rotate(0deg);
        }
        50% {
          opacity: 0.9;
          transform: scale(1) rotate(45deg);
        }
      }

      .gx-shoot {
        width: 190px;
        height: 1.5px;
        margin: -0.75px 0 0 -190px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--gx-fg));
        transform-origin: 100% 50%;
        translate: -40vw -34vh;
        rotate: 21deg;
        animation: gx-shoot 0.9s cubic-bezier(0.3, 0, 0.7, 1) 1.6s both;
      }

      .gx-shoot:nth-child(6) {
        translate: 14vw -40vh;
        rotate: 24deg;
        animation-delay: 5.4s;
      }

      @keyframes gx-shoot {
        0% {
          opacity: 0;
          transform: translateX(0) scaleX(0.1);
        }
        15% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translateX(400px) scaleX(1);
        }
      }

      /* Spiral galaxy on a tilted plane: swirls in, turns, then eases to a stop. */
      .gx-disk {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: rotate(-12deg) scaleY(0.36);
      }

      .gx-spin {
        position: absolute;
        animation: gx-swirl 10s 0.2s both;
      }

      .gx-spin > * {
        position: absolute;
      }

      /* The two segments meet at the same angular speed, so the swirl flows into
         the slow turn without a hitch. */
      @keyframes gx-swirl {
        0% {
          opacity: 0;
          transform: rotate(-160deg) scale(0.3);
          animation-timing-function: cubic-bezier(0.2, 0.9, 0.4, 0.95);
        }
        8% {
          opacity: 1;
        }
        21% {
          transform: rotate(0deg) scale(1);
          animation-timing-function: cubic-bezier(0.3, 0.375, 0.55, 1);
        }
        100% {
          opacity: 1;
          transform: rotate(40deg) scale(1);
        }
      }

      .gx-core {
        width: 380px;
        height: 380px;
        margin: -190px;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          color-mix(
            in oklab,
            color-mix(in oklab, var(--gx-fg) 55%, var(--gx-accent)) calc(75% * var(--gx-k)),
            transparent
          ),
          color-mix(in oklab, var(--gx-accent) calc(38% * var(--gx-k)), transparent) 28%,
          transparent
        );
      }

      .gx-haze {
        --gx-haze:
          130px 193px 24px 9px, 71px -100px 24px 9px, -279px -179px 24px 9px, -12px -192px 24px 9px,
          -410px 12px 24px 9px, -73px 87px 24px 9px, -234px -203px 24px 9px, -64px -191px 24px 9px,
          71px -109px 24px 9px, 63px -122px 24px 9px, -80px 65px 24px 9px, 61px -127px 24px 9px,
          205px 217px 24px 9px, -21px 173px 24px 9px, -78px 77px 24px 9px, 60px -113px 24px 9px,
          -154px -199px 24px 9px, 353px 81px 24px 9px, -64px 106px 24px 9px, 53px -126px 24px 9px,
          -52px -197px 24px 9px, 20px -156px 24px 9px, -41px 155px 24px 9px, -155px -192px 24px 9px,
          -24px -183px 24px 9px, 301px 182px 24px 9px, 25px -166px 24px 9px, -401px -75px 24px 9px,
          -79px 94px 24px 9px, 142px 217px 24px 9px, -42px 150px 24px 9px, -2px -186px 24px 9px,
          -12px -189px 24px 9px, 213px 205px 24px 9px, -34px 141px 24px 9px, 428px -12px 24px 9px,
          128px 226px 24px 9px, -208px -217px 24px 9px, -49px 128px 24px 9px, 356px 99px 24px 9px,
          -81px 67px 24px 9px, -77px 21px 24px 9px, -34px -203px 24px 9px, 80px -48px 24px 9px,
          -189px -193px 24px 9px, -34px 154px 24px 9px, -314px -151px 24px 9px, 28px 190px 24px 9px,
          184px 200px 24px 9px, -300px -131px 24px 9px;
        width: 2px;
        height: 2px;
        margin: -1px;
        border-radius: 50%;
        color: color-mix(in oklab, var(--gx-accent) calc(30% * var(--gx-k)), transparent);
        box-shadow: var(--gx-haze);
      }

      .gx-arms {
        width: 1040px;
        height: 1040px;
        margin: -520px;
        fill: none;
        stroke-linecap: round;
      }

      .gx-a1 {
        stroke: var(--gx-fg);
        stroke-width: 2.5;
        stroke-opacity: 0.9;
      }

      .gx-a2 {
        stroke: color-mix(in oklab, var(--gx-accent) 70%, var(--gx-fg));
        stroke-width: 3.2;
      }

      .gx-a3 {
        stroke: var(--gx-fg);
        stroke-width: 1.8;
        stroke-opacity: 0.45;
      }

      /* Hyperspace drop-out: 6 groups of 8 streaks, 45deg apart within a group. */
      .gx-warp,
      .gx-warp b,
      .gx-warp i {
        position: absolute;
      }

      .gx-warp {
        top: 50%;
        left: 50%;
      }

      .gx-warp b:nth-child(2) {
        rotate: 7deg;
      }

      .gx-warp b:nth-child(3) {
        rotate: 15deg;
      }

      .gx-warp b:nth-child(4) {
        rotate: 22deg;
      }

      .gx-warp b:nth-child(5) {
        rotate: 30deg;
      }

      .gx-warp b:nth-child(6) {
        rotate: 38deg;
      }

      .gx-warp i {
        top: -1px;
        width: 220px;
        height: 2px;
        border-radius: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in oklab, var(--gx-fg) calc(80% * var(--gx-k)), transparent)
        );
        transform-origin: 0 50%;
        opacity: 0;
        animation: gx-streak 0.8s cubic-bezier(0.35, 0, 0.75, 0.55) both;
      }

      .gx-warp i:nth-child(2) {
        rotate: 45deg;
      }

      .gx-warp i:nth-child(3) {
        rotate: 90deg;
      }

      .gx-warp i:nth-child(4) {
        rotate: 135deg;
      }

      .gx-warp i:nth-child(5) {
        rotate: 180deg;
      }

      .gx-warp i:nth-child(6) {
        rotate: 225deg;
      }

      .gx-warp i:nth-child(7) {
        rotate: 270deg;
      }

      .gx-warp i:nth-child(8) {
        rotate: 315deg;
      }

      .gx-warp i:nth-child(4n + 2) {
        background: linear-gradient(90deg, transparent, var(--gx-accent));
      }

      .gx-warp i:nth-child(3n) {
        width: 130px;
        animation-duration: 0.95s;
      }

      .gx-warp b:nth-child(odd) i {
        animation-delay: 60ms;
      }

      @keyframes gx-streak {
        0% {
          opacity: 0;
          transform: translateX(40px) scaleX(0.15);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateX(900px) scaleX(1.3);
        }
      }

      /* Logo and orbit. The ring is drawn twice, the half behind the letters and
         the half in front. The satellite rides a radius-176 circle in a plane
         squashed to the ring's 28/176 aspect, so it stays exactly on the ring;
         each dot counter-rotates and un-squashes to stay round, and grows in front. */
      .gx-center {
        position: relative;
        display: grid;
        place-items: center;
        width: 380px;
        height: 220px;
      }

      /* The mark flies in from depth: the wrapper scales while a pre-blurred copy
         cross-fades into the sharp one (blur is rasterised once, never animated). */
      .gx-mark {
        position: relative;
        z-index: 1;
        width: 142px;
        color: var(--gx-fg);
        animation: gx-mark-in 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .gx-mark svg {
        width: 100%;
      }

      .gx-mark-blur {
        position: absolute;
        inset: 0;
        fill: currentColor;
        opacity: 0;
        animation: gx-mark-blur 1s ease-out both;
      }

      .gx-mark-ink {
        fill: none;
        stroke: var(--gx-bg);
        stroke-linejoin: round;
        animation: gx-mark-ink 1s ease-out both;
      }

      /* A soft background-coloured halo keeps the letters crisp over the bright
         core. The blur is an SVG filter, rasterised once, not a per-frame effect. */
      .gx-glow {
        stroke-width: 5;
        stroke-opacity: 0.3;
        filter: url(#gx-soft);
      }

      .gx-edge {
        stroke-width: 1.4;
        stroke-opacity: 0.55;
      }

      /* Static translucent layers let the galaxy show through the mark.
         Only the existing entrance animates; the glass adds no ongoing filters. */
      .gx-ink {
        fill: url(#gx-glass-body);
        stroke: none;
      }

      .gx-sheen {
        fill: url(#gx-glass-sheen);
        stroke: none;
      }

      .gx-rim {
        fill: none;
        stroke: url(#gx-glass-rim);
        stroke-width: 0.75;
      }

      @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
        .gx-ink {
          fill: currentColor;
        }

        .gx-sheen,
        .gx-rim {
          display: none;
        }
      }

      @keyframes gx-mark-in {
        from {
          transform: scale(1.9);
        }
      }

      @keyframes gx-mark-blur {
        0% {
          opacity: 0;
        }
        25% {
          opacity: 0.9;
        }
        70% {
          opacity: 0;
        }
      }

      @keyframes gx-mark-ink {
        0%,
        20% {
          opacity: 0;
        }
        65% {
          opacity: 1;
        }
      }

      .gx-orbit {
        position: absolute;
        inset: 0;
        rotate: -12deg;
      }

      .gx-behind {
        clip-path: inset(-60px -60px 50%);
      }

      .gx-front {
        z-index: 2;
        clip-path: inset(50% -60px -60px);
      }

      .gx-orbit svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
      }

      .gx-ring {
        position: absolute;
        inset: 0;
        stroke: currentColor;
        stroke-opacity: 0.22;
        stroke-width: 1.2;
        animation: gx-ring-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }

      .gx-front .gx-ring {
        stroke-opacity: 0.42;
      }

      @keyframes gx-ring-in {
        from {
          opacity: 0;
          transform: scale(0.45);
        }
      }

      .gx-plane {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: scaleY(0.159091);
        animation: gx-plane 10s 0.8s both;
      }

      /* One animation for fade in and out: two opacity animations on one element
         would force it off the compositor. */
      @keyframes gx-plane {
        0% {
          opacity: 0;
          animation-timing-function: ease-out;
        }
        7%,
        94% {
          opacity: 1;
          animation-timing-function: ease-in;
        }
        100% {
          opacity: 0;
        }
      }

      .gx-plane * {
        position: absolute;
      }

      .gx-arm {
        transform: rotate(40deg);
        animation: gx-orbit 3.2s linear 0.8s 3 both;
      }

      @keyframes gx-orbit {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Head plus an 8-dot tail trailing it in 3.5deg steps. */
      .gx-arm i {
        width: var(--z);
        height: var(--z);
        margin: calc(var(--z) / -2);
        border-radius: 50%;
        background: var(--gx-accent);
        transform: rotate(-40deg) scaleY(6.285714) scale(1.19);
        animation: gx-counter 3.2s linear 0.8s 3 both;
      }

      .gx-arm i:nth-child(1) {
        --z: 3.5px;
        translate: 155.4px -82.6px;
        opacity: 0.065;
      }

      .gx-arm i:nth-child(2) {
        --z: 4.2px;
        translate: 160.2px -73px;
        opacity: 0.115;
      }

      .gx-arm i:nth-child(3) {
        --z: 4.9px;
        translate: 164.3px -63.1px;
        opacity: 0.172;
      }

      .gx-arm i:nth-child(4) {
        --z: 5.6px;
        translate: 167.9px -52.9px;
        opacity: 0.235;
      }

      .gx-arm i:nth-child(5) {
        --z: 6.3px;
        translate: 170.8px -42.6px;
        opacity: 0.303;
      }

      .gx-arm i:nth-child(6) {
        --z: 7px;
        translate: 173.1px -32.1px;
        opacity: 0.376;
      }

      .gx-arm i:nth-child(7) {
        --z: 7.7px;
        translate: 174.7px -21.4px;
        opacity: 0.454;
      }

      .gx-arm i:nth-child(8) {
        --z: 8.4px;
        translate: 175.7px -10.7px;
        opacity: 0.535;
      }

      .gx-arm i:nth-child(9) {
        --z: 10px;
        translate: 176px 0;
        background: color-mix(in oklab, var(--gx-accent) 55%, white);
        box-shadow:
          0 0 8px 2px color-mix(in oklab, var(--gx-accent) 80%, transparent),
          0 0 26px 7px color-mix(in oklab, var(--gx-accent) 35%, transparent);
      }

      @keyframes gx-counter {
        0% {
          transform: rotate(0deg) scaleY(6.285714) scale(1);
        }
        12.5% {
          transform: rotate(-45deg) scaleY(6.285714) scale(1.21);
        }
        25% {
          transform: rotate(-90deg) scaleY(6.285714) scale(1.3);
        }
        37.5% {
          transform: rotate(-135deg) scaleY(6.285714) scale(1.21);
        }
        50% {
          transform: rotate(-180deg) scaleY(6.285714) scale(1);
        }
        62.5% {
          transform: rotate(-225deg) scaleY(6.285714) scale(0.79);
        }
        75% {
          transform: rotate(-270deg) scaleY(6.285714) scale(0.7);
        }
        87.5% {
          transform: rotate(-315deg) scaleY(6.285714) scale(0.79);
        }
        100% {
          transform: rotate(-360deg) scaleY(6.285714) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .gx *,
        .gx *::before,
        .gx *::after {
          animation: none !important;
        }

        .gx-arm i:not(:last-child) {
          display: none;
        }
      }

      #boot-error {
        display: grid;
        justify-items: center;
        gap: 16px;
        max-width: 600px;
        padding: 24px;
        text-align: center;
      }

      #boot-error p {
        margin: 0;
        overflow-wrap: anywhere;
      }

      #boot-error button {
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <style>
      /* ---------- preview-only ---------- */
      html.gx-reduce .gx *,
      html.gx-reduce .gx *::before,
      html.gx-reduce .gx *::after {
        animation: none !important;
      }
      html.gx-reduce .gx-arm i:not(:last-child) {
        display: none;
      }
      body {
        overflow: hidden;
      }
      .skel {
        display: grid;
        grid-template-columns: 272px 1fr;
        height: 100%;
      }
      .skel aside {
        display: grid;
        align-content: start;
        gap: 14px;
        padding: 64px 20px;
        border-right: 1px solid color-mix(in oklab, currentColor 10%, transparent);
        background: color-mix(in oklab, currentColor 3%, transparent);
      }
      .skel aside i {
        height: 12px;
        border-radius: 6px;
        background: color-mix(in oklab, currentColor 10%, transparent);
      }
      .skel aside i:nth-child(odd) {
        width: 70%;
      }
      .skel-tag {
        position: fixed;
        top: 16px;
        right: 20px;

        );
      });

      // Live proof that the splash settles: running animations drop to 0.
      const stats = document.getElementById("stats");
      setInterval(() => {
        const running = root
          .getAnimations({ subtree: true })
          .filter((a) => a.playState === "running").length;
        const t = ((performance.now() - startedAt) / 1000).toFixed(1);
        stats.textContent = `${SIZE} · ${running} animations running · ${t}s`;
      }, 250);

      const bar = document.getElementById("bar");
      let idleTimer;
      const wake = () => {
        bar.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          if (!bar.matches(":hover, :focus-within")) bar.classList.add("idle");
        }, 2500);
      };
      ["pointermove", "keydown", "pointerdown"].forEach((type) =>
        document.addEventListener(type, wake),
      );

      setTheme("dark");
      wake();
    </script>
  </body>
</html>
